cv:
  name: Kevin Chi Hao Ly
  label: Machine Learning for Perturbation Biology
  location: Cambridge, UK
  image: ""
  summary: >-
    I build generative AI models that predict how cells respond to genetic and chemical perturbations,
    and I work closely with experimental collaborators to turn those predictions into testable hypotheses.
    I combine deep-learning engineering at scale, hands-on wet-lab experience (CRISPR editing, organoids)
    and industry experience building production data systems at Roche.

