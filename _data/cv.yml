        end_date: 2021-08
        highlights:
          - "MSc thesis (wet lab and computational): engineered CRISPR-Cas9 knockout and knock-in stem cell lines, grew them into cerebral organoids, and built image-analysis pipelines for 4D light-sheet lineage tracing (published in Nature Methods)."

      - institution: ETH Zürich
        location: Zürich, Switzerland
