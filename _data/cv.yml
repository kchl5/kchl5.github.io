    Experience:
      - company: Wellcome Sanger Institute / University of Cambridge
        position: PhD Researcher, Machine Learning for Perturbation Biology
        location: Cambridge, UK
        start_date: 2022-09
        end_date: 2026-12
        highlights:
          - "PerturbGen (project lead, co-first author; bioRxiv preprint): generative Transformer built on a single-cell foundation model (pre-trained on 107M cells) that predicts how perturbations reshape cell differentiation. I led its in silico screen of 5,700 genes, which nominated new regulators of blood-cell development that collaborators then validated experimentally."
          - "Multimodal generative models that translate gene-expression responses into cell-morphology images, connecting two key readouts of high-throughput drug and CRISPR screens (project lead; manuscript under review)."
          - "Trained 100M+ parameter models on multi-GPU clusters; core contributor to the open-source PerturbGen Python package."

      - company: Roche Pharma R&D
        position: Data & Analytics Specialist; Data Science Intern
        location: Basel, Switzerland
        start_date: 2021-01
        end_date: 2022-08
        highlights:
          - Built production cloud data pipelines (GCP, CI/CD) bringing laboratory instrument data into a central data lake, working with scientists and engineers across the US and EU.
          - Automated analytical workflows for lab scientists (Python, R Shiny, Plotly), saving about 30 minutes per analytical run.
          - Worked in Agile/Scrum teams developing software for lab scientists.

